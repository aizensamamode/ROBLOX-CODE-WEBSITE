<!DOCTYPE html>
<html>
<head>
    <title>Blox Fruit</title>

    <style>
        body {
            background-color: #0f0f0f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        h1 {
            margin-top: 30px;
            color: #00ffcc;
        }

        ul {
            list-style: none;
            padding: 0;
            max-width: 600px;
            margin: 30px auto;
        }

        li {
            background: #1e1e1e;
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            transition: 0.3s;
        }

        li:hover {
            background: #00ffcc;
            color: black;
            transform: scale(1.05);
            cursor: pointer;
        }


 
    </style>
</head>

<body>
    <nav class="navbar">
        <ul class="nav-list">
            <li><a href="/shindo">Shindo Life</a></li>
            <li><a href="/kaizen">Kaizen</a></li>
            <li><a href="/bloxfruit">Blox Fruits</a></li>
        </ul>
    </nav>

    <h1>🔥 Blox Fruit 🔥</h1>

    <ul>
        {% for code in codes %}
            <li>{{ code }}</li>
        {% endfor %}
    </ul>

</body>
</html>
